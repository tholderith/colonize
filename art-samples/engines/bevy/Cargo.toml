[package]
name = "colonize_bevy_render"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Minimal Bevy: no winit/window backend, no audio, no UI, no 3D/PBR.
# We render headlessly into an Image render target and read it back.
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "png",
] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
