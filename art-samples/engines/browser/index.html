<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Colonize Art Viewer</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
  body.render { width: 1920px; height: 1080px; }
  canvas { display: block; }
  #hud { position: fixed; top: 84px; right: 12px; z-index: 10; font: 13px/1.3 system-ui, sans-serif;
         background: rgba(15, 20, 28, 0.85); color: #eee; padding: 8px 10px; border-radius: 6px;
         box-shadow: 0 2px 8px rgba(0,0,0,0.4); max-width: 240px; }
  #hud select { width: 100%; margin-top: 4px; font: inherit; }
  #hud .hint { color: #9aa; font-size: 11px; margin-top: 6px; }
  #tip { position: fixed; z-index: 11; pointer-events: none; display: none; font: 12px/1.3 system-ui, sans-serif;
         background: rgba(15, 20, 28, 0.92); color: #ffe9a8; padding: 4px 8px; border-radius: 4px;
         border: 1px solid #c9a24a; white-space: nowrap; }
  #err { position: fixed; inset: 0; color: #f88; font: 14px monospace; padding: 20px; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="err"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
